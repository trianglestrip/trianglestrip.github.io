baseURL = "https://trianglestrip.github.io/"
title = "随手记录"
theme = "book"
locale = "zh-CN"
defaultContentLanguage = "zh-cn"
hasCJKLanguage = true
enableGitInfo = true
enableEmoji = true

# Hugo Book 配置
disablePathToLower = true

[params]
  # 配色：light / dark / auto
  BookTheme = "auto"

  # 侧边栏导航的根 section（从哪个 section 渲染多级菜单）
  BookSection = "posts"

  # 站点仓库，用于「编辑此页 / 最后修改」链接（需要 enableGitInfo）
  BookRepo = "https://github.com/trianglestrip/trianglestrip.github.io"
  BookEditLink = '{{ .Site.Params.BookRepo }}/edit/master/content/{{ .Path }}'
  BookLastChangeLink = '{{ .Site.Params.BookRepo }}/commit/{{ .GitInfo.Hash }}'

  # 全局日期格式
  BookDateFormat = '2006-01-02'

  # 开启站内搜索（fuse.js）
  BookSearch = true

  # 关闭默认 Disqus 评论（如需可在此启用并配置）
  BookComments = false

# 顶部 / 侧边导航菜单（Book 使用 menu.home / menu.after）
[menu]
  [[menu.home]]
    name = '文章'
    pageRef = '/posts/'
    weight = 1
  [[menu.home]]
    name = '随手记'
    pageRef = '/notes/'
    weight = 2
  [[menu.home]]
    name = '热榜'
    pageRef = '/news/'
    weight = 3
  [[menu.home]]
    name = '关于'
    pageRef = '/about/'
    weight = 4

  [[menu.after]]
    name = 'GitHub'
    url = 'https://github.com/trianglestrip/trianglestrip.github.io'
    weight = 10

# Book 的 source / txt 输出
[outputFormats]
  [outputFormats.txt]
    mediaType = 'text/plain'
    baseName = 'source'
    isPlainText = true

[outputs]
  home = ['html', 'txt', 'rss']
  page = ['html', 'txt']
  section = ['html', 'txt']

[markup]
  [markup.goldmark.renderer]
    unsafe = true
  [markup.tableOfContents]
    startLevel = 1
  [markup.highlight]
    style = 'base16-snazzy'
