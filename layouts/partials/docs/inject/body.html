<style>
  /* ===== 顶部导航栏（使用 book 主题 CSS 变量，自动跟随 light/dark/auto） ===== */

  .top-nav {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    z-index: 9999;
    display: flex;
    align-items: center;
    height: 56px;
    padding: 0 24px;
    background: var(--body-background);
    border-bottom: var(--space-1) solid var(--gray-200);
    font-size: var(--font-size-smaller);
    font-family: inherit;
  }

  /* 站点标题 */
  .nav-brand {
    font-size: 110%;
    font-weight: 700;
    color: var(--body-font-color);
    text-decoration: none;
    margin-right: 32px;
    white-space: nowrap;
  }

  /* 导航链接容器 */
  .nav-links {
    display: flex;
    align-items: center;
    gap: 24px;
    flex-wrap: nowrap;
    overflow-x: auto;
  }

  .nav-link {
    color: var(--body-font-color);
    opacity: 0.7;
    text-decoration: none;
    padding: 4px 0;
    white-space: nowrap;
    transition: opacity 0.2s, color 0.2s;
    line-height: 56px;
  }

  .nav-link:hover {
    opacity: 1;
    color: var(--color-link);
  }

  .nav-link.active {
    opacity: 1;
    color: var(--color-link);
    font-weight: 600;
    border-bottom: 2px solid var(--color-link);
  }

  /* ===== 布局调整：隐藏桌面侧边栏，内容全宽 ===== */

  body {
    padding-top: 56px;
  }

  @media (min-width: 769px) {
    .book-menu {
      display: none !important;
    }

    .book-page {
      max-width: 100% !important;
      flex: 1 !important;
      padding-left: 0 !important;
    }

    main.container.flex {
      padding: 0 16px;
    }

    .book-header {
      display: none !important;
    }
  }

  /* 移动端导航栏适配 */
  @media (max-width: 768px) {
    .top-nav {
      padding: 0 12px;
      height: 48px;
    }

    body {
      padding-top: 48px;
    }

    .nav-brand {
      font-size: 100%;
      margin-right: 16px;
    }

    .nav-links {
      gap: 16px;
    }

    .nav-link {
      font-size: var(--font-size-smallest);
      line-height: 48px;
    }
  }
</style>

<!-- LoveIt 风格顶部导航栏 -->
<nav class="top-nav">
  <a href="/" class="nav-brand">{{ .Site.Title }}</a>
  <div class="nav-links">
    {{ range .Site.Menus.main }}
      <a href="{{ .URL }}" class="nav-link{{ if hasPrefix $.RelPermalink .URL }} active{{ end }}">{{ .Name }}</a>
    {{ end }}
  </div>
</nav>
